version: 2

models:
  - name: int_daily_consumption
    description: Aggregates interval meter readings to daily consumption by meter.

    columns:
      - name: meter_id
        description: Unique identifier for the meter.
        data_tests:
          - not_null

      - name: reading_date
        description: Calendar date of the aggregated readings.
        data_tests:
          - not_null

      - name: total_consumption_kwh
        description: Total energy consumed by the meter on the day.
        data_tests:
          - not_null

      - name: reading_count
        description: Number of interval readings included in the daily aggregation.
        data_tests:
          - not_null

  - name: int_customer_daily_consumption
    description: Daily energy consumption enriched with customer and meter attributes.

    columns:
      - name: customer_id
        description: Unique identifier for the customer.
        data_tests:
          - not_null

      - name: meter_id
        description: Unique identifier for the meter.
        data_tests:
          - not_null

      - name: reading_date
        description: Consumption date.
        data_tests:
          - not_null

      - name: total_consumption_kwh
        description: Daily energy consumption in kilowatt-hours.
        data_tests:
          - not_null